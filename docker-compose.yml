services:
  web:
    build: .
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      MARIADB_DATABASE: gestion_voyage
    volumes:
      - db_data:/var/lib/mysql
      - ./gestion_voyage.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
